# seed-01 の受け入れデモ: 所見 0 件になる企画核（t01 灯台の鍵）。
# 「良い企画」の見本ではなく、「検証可能な形」の見本である。
logline: 嵐の夜、灯台守の娘が、灯りを守る務めと、鍵の行方を追う誘いのあいだで選ぶ。
elements:
  who: 灯台守の娘
  where: 嵐の夜
  wants: 鍵の行方を追う
  obstacle: 灯りを守る務め
premise: 死んだはずの人物の手に鍵が渡っていた。娘は灯りを守るか追跡かを選ばねばならない。
theme: 灯りを守る務め対鍵の真相を追う誘い
similar:
  - title: 灯台守と珊瑚の娘
    axis: structure
    difference: 恋愛の成就ではなく選択の未解決に寄せ、結末で答えを出さない。
  - title: 嵐の鍵屋
    axis: character
    difference: 職人の矜持ではなく娘の好奇心が推進力で、失敗の代償が灯り全体に及ぶ。
  - title: 霧の港の年代記
    axis: world
    difference: 港町の制度史ではなく一夜の灯台に絞り、世界の規則を灯りの掟一種に絞る。
prohibitions:
  - rule: 選ばれし者の血統を使わない
    check_ja: 本文に「選ばれ」「血統」「予言」が出たら違反とする。
  - rule: 夢オチで解決しない
    check_ja: 最終章に「夢」「目覚め」による反転がないことを目視する。
failure_questions:
  - 鍵の謎が序盤で解けてしまわないか？
  - 灯りを守る必然性が読者に伝わるか？
genre: 幻想
audience: 短編を読む成人
