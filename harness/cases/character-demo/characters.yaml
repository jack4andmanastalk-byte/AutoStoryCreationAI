# seed-04 の受け入れデモ: 所見 0 件の人物核（2 名）。
# ID の照合先は harness/cases/demo/canon（aria・boris・celia）。
characters:
  - id: aria
    want: 灯台守の娘として灯りを絶やさないこと
    need: 鍵の真相を知り、自分の選択で灯りを守ること
    fear: 灯りを絶やし、船を見殺しにすること
    wound: 幼い頃の嵐の夜に、消えた灯りの責任を問われたこと
    secret: 鍵を貸した相手を父に言っていない
    principle: 確かめずに信じない。信じたものは守る
    self_view: 父の言いつけを守る堅実な娘
    others_view:
      - 父から見れば心配性の娘
      - ボリスから見れば鍵に執着する娘
    predictions:
      - situation: 鍵の返却と灯りの番が重なったら
        choice: 灯りの番を優先し、鍵は後で追う
      - situation: 父の命令と自分の確かめたい気持ちが衝突したら
        choice: 命令に従う振りをして確かめに行く
      - situation: 借り手が死んだと知ったら
        choice: 帳面を疑い、貸借の記録を洗い直す
    speech:
      sample: 「灯りは消さない。鍵は返す。それだけよ」とアリアは言い、革袋を握りしめた。
      vocab: [灯り, 鍵, 帳面]
      avoid: [～かしら, ～だわ]
    arc:
      endpoint: 言いつけを守る娘から、自分の選択で灯りを守る灯台守になる
      changed: [父の命令への従い方, 鍵への執着の向き先]
      unchanged: [灯りを絶やさないこと, 確かめずに信じないこと]
    bans:
      - 確かめずに他人の言い分を信じる
      - 灯りを犠牲にして鍵を追う
  - id: boris
    want: 預かり物の鍵を無事に返すこと
    need: 灯台守の娘に仕事の価値を認めさせること
    fear: 預かり物を失くし、鍵屋の看板を汚すこと
    wound: 若い頃に預かり物を失くした噂が残っていること
    secret: 帳面の写しを余分に取っている
    principle: 預かり物は顔を見ずに扱う。記録は残す
    self_view: 口数の少ない職人気質の鍵屋
    others_view:
      - アリアから見れば無愛想な鍵屋
    predictions:
      - situation: 預かり主が死んだと知ったら
        choice: 帳面に従って組合に届ける
      - situation: 賄賂で鍵の情報を求められたら
        choice: 断り、帳面に記録する
      - situation: アリアが帳面の写しを求めたら
        choice: 一頁だけ写させ、礼を取らない
    speech:
      sample: 「預かり物だ」とボリスは言った。顔は上げず、帳面に目を落としたままだった。
      vocab: [預かり物, 帳面]
      avoid: [丁寧すぎる敬語, 長い説明]
    arc:
      endpoint: 顔を見ない鍵屋のまま、記録を残す者として認められる
      changed: [アリアへの応対の温度]
      unchanged: [預かり物の扱い, 記録を残すこと]
    bans:
      - 預かり物の素性を詮索する
