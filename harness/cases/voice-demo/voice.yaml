# seed-09 の受け入れデモ: 一人称・視点人物=凪の文体仕様。
viewpoint:
  person: first
  character: 凪
  aliases: [なぎ]
  pronouns: [私]
narrator:
  knows_ja: 凪が見聞きしたことだけを地の文で書く。他者の心中は台詞と所作からのみ推し、断定しない。
sample: |
  雨が灯台の窓を叩いた。私は鍵を握りしめ、階段を見上げた。鍵は冷たく、重かった。
  「登るのか」と父が訊いた。私はうなずいた。灯りが消えれば、船は帰れない。
  階段は濡れていた。一段ずつ、滑らないように登った。風の音が遠くなった。
banned:
  - id: emotion_naming
    pattern: "(悲しかった|嬉しかった|楽しかった|寂しかった)。"
    message_ja: 感情の直接命名。所作か知覚で示すか、台詞に移す。
  - id: frozen_simile
    pattern: "(まるで時間が止まったかのよう|まるで夢のよう)"
    message_ja: 在庫の比喩。作品固有の事物に置き換える。
notes: サンプルは 300 字程度の照合基準。文の巧拙の見本ではない。
