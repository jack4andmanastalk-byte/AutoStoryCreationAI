name: research-check

# Repository CI: catalog integrity, skills, harness, pipeline and protocol.
#
# Why this workflow is small on purpose
# -------------------------------------
# This repository is private, so GitHub-hosted runners share one concurrency
# budget (20 jobs on the Free plan). `dataset-refresh` fans out 20 shards and
# used to fill that budget, which left this job queued for tens of minutes
# behind a 30-minute PDF build.
#
# Two things keep CI fast now:
#   1. `dataset-refresh` caps its matrix (`max-parallel`), reserving slots.
#   2. This workflow has its own concurrency group, so a superseded commit is
#      cancelled instead of queueing behind itself.
#
# The repository is public (since 2026-10-23), so standard hosted runners no
# longer consume paid minutes; the billing block that stopped every job is gone.
# The concurrency budget (20 jobs) remains, which is why the dataset build
# still caps its matrix.
#
# Set the repository variable `CI_RUNNER_LABEL` to a self-hosted runner label
# to take CI off the shared budget entirely; nothing else needs to change.
# See docs/ci.md.
on:
  push:
    branches:
      - "**"
      # The dataset bot force-pushes this branch in several batches; those
      # commits cannot change code, so checking them only burns runner slots.
      - "!datasets"
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref: a new push cancels the previous, unfinished check.
  group: research-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The catalog is committed, so a change to research/curated without
      # regenerating it (or a hand edit of the generated files) fails here.
      - name: Check the catalog is up to date
        run: python scripts/build_research_catalog.py --check

      # Run the whole suite rather than a hand-maintained list: the previous
      # list had to be edited for every new test file and drifted silently.
      # Rendering tests skip themselves when the Japanese fonts are absent.
      - name: Run the test suite
        run: python -m pytest tests -q

      # The demo cases are the acceptance criteria of the seven skills; run them
      # explicitly so a regression names the failing artifact in the log.
      - name: Audit the demo story (continuity-ledger)
        run: |
          python scripts/audit_continuity.py \
            --canon harness/cases/demo/canon \
            --text harness/cases/demo/text \
            --out /tmp/audit.json --ledger /tmp/ledger.json \
            --markdown /tmp/audit.md --fail-on none --quiet

      - name: Check the design demos (premise/world/history/voice)
        run: |
          python scripts/check_brief.py --brief harness/cases/brief-demo/brief.yaml --quiet
          python scripts/check_world.py --world harness/cases/world-demo/world.yaml \
            --canon harness/cases/demo/canon --quiet
          python scripts/check_history.py --history harness/cases/history-demo/history.yaml \
            --canon harness/cases/demo/canon --quiet
          python scripts/check_voice.py --voice harness/cases/voice-demo/voice.yaml \
            --text harness/cases/voice-demo/text --fail-on none --quiet

      - name: Run the revision demo (revision-loop)
        run: |
          python scripts/audit_continuity.py --canon harness/cases/revision-demo/canon \
            --text harness/cases/revision-demo/text --out /tmp/rev-before.json \
            --fail-on none --quiet
          python scripts/revise.py --mode apply --text harness/cases/revision-demo/text \
            --patch harness/cases/revision-demo/patch.json --out /tmp/rev-text --quiet
          python scripts/audit_continuity.py --canon harness/cases/revision-demo/canon \
            --text /tmp/rev-text --out /tmp/rev-after.json --fail-on none --quiet
          python scripts/revise.py --mode compare --before /tmp/rev-before.json \
            --after /tmp/rev-after.json --quiet

      - name: Run the S2/S3 scripted pipeline
        run: |
          python scripts/run_pipeline.py --task t01 --system s2 --out /tmp/runs-ci \
            --script benchmarks/protocol-v1/fixtures/pipeline-s2s3-demo.json \
            --report-only --quiet
          python scripts/run_pipeline.py --task t01 --system s3 --out /tmp/runs-ci \
            --script benchmarks/protocol-v1/fixtures/pipeline-s2s3-demo.json \
            --report-only --quiet

      - name: Calibrate the demo labels (L2/L3 tooling)
        run: |
          python scripts/calibrate_judge.py --labels harness/fixtures/labels-demo \
            --verdicts harness/fixtures/verdicts-demo.json --quiet

      - name: Evaluate the demo story (evaluation-harness)
        run: |
          python scripts/run_evaluation.py \
            --candidate harness/cases/demo/text \
            --baseline harness/cases/demo-baseline/text \
            --canon harness/cases/demo/canon \
            --rubric harness/rubrics/story-quality-v0.yaml \
            --patterns harness/patterns.yaml \
            --judge-fixture harness/fixtures/judgements-demo.json \
            --out /tmp/eval --report-only

      - name: Print the evaluation report
        run: cat /tmp/eval/report.md
