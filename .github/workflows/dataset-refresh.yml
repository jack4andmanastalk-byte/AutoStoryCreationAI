name: dataset-refresh

# Refreshes the research datasets of AutoStoryCreationAI.
#
# The workflow runs exactly the same pipeline as ``make data`` (see
# ``scripts/setup_dataset.py``) but on the GitHub runners, which can reach
# www.aozora.gr.jp and api.syosetu.com.  The generated files are published on
# the dedicated ``datasets`` branch (and additionally attached as an
# artifact), so that they can be consumed without cloning the repository:
#
#   git fetch origin datasets
#   git show origin/datasets:datasets/aozora_works.jsonl | head -1
on:
  workflow_dispatch:
    inputs:
      narou_works:
        description: "Number of novels per genre/ordering"
        default: "200"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/dataset-refresh.yml"
      - "scripts/**"
      - "src/**"
      - "configs/**"
  schedule:
    # every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the Aozora Bunko bibliographic records
        run: python scripts/setup_dataset.py aozora-metadata

      - name: Fetch the Narou bibliographic records
        run: |
          python scripts/fetch_narou_api.py --per-query 200 --out-dir data/cache/narou_api
          python scripts/setup_dataset.py narou-metadata

      - name: Fetch texts and PDFs (Aozora)
        run: python scripts/setup_dataset.py aozora-texts --works 10 --pdf

      - name: Fetch texts and PDFs (Narou)
        run: python scripts/setup_dataset.py narou-texts --works 10 --pdf

      - name: Report
        run: python scripts/dataset_report.py

      - name: Publish the datasets to the `datasets` branch
        run: |
          mkdir -p publish
          cp -r data/datasets publish/datasets
          cp -r data/raw publish/raw
          cp -r data/pdf publish/pdf
          cd publish
          git init -q
          git config user.name "dataset-bot"
          git config user.email "dataset-bot@users.noreply.github.com"
          git checkout -q -b datasets
          git add -A
          git commit -q -m "datasets: $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin datasets

      - name: Upload the datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datasets
          path: |
            data/datasets/*.jsonl
            data/datasets/manifest.json
            data/raw/**
            data/pdf/**
          retention-days: 30
